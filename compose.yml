services:
  senti-pwa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senti-pwa
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.senti-pwa.tls=true"
      - "traefik.http.routers.senti-pwa.entrypoints=websecure"
      - "traefik.http.routers.senti-pwa.rule=Host(`senti.cloud.hochform.net`)"
      - "traefik.http.routers.senti-pwa.tls.certresolver=letsencryptresolver"      
      - "traefik.http.services.senti-pwa.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"

networks:
  traefik:
    external: true
